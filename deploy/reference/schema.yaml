schemaVersion: 1.1.0
version: "20260915"
title: OCI Pool Controller Reference Implementation
description: Unsupported reference implementation for existing OCI instance pools.
informationalText: >-
  Apply creates a private OCIR repository, builds the included Function source,
  and deploys it. No prebuilt image is required. Supply registry authentication
  below. Existing worker pools and networking are required; this stack does not
  create or retag them. Plan discovers tagged pools in the selected compartment;
  review the exact enrollment and limits before Apply. Start with dry-run enabled
  and termination disabled.
variableGroups:
  - title: Existing infrastructure
    variables: [region, tenancy_ocid, controller_compartment_ocid, pool_compartment_ocid, network_compartment_ocid, function_vcn_ocid, registry_compartment_ocid, subnet_ids]
  - title: Function deployment
    variables: [build_function_image, ocir_username, ocir_auth_token, function_image, function_image_digest, function_shape]
  - title: Pool enrollment
    variables: [auto_discover_pools, default_pool_max_size, scope_id]
  - title: Advanced manual enrollment
    visible:
      not: ["${auto_discover_pools}"]
    variables: [pools]
  - title: Advanced discovery overrides
    visible: ${auto_discover_pools}
    variables: [pool_overrides]
  - title: Safety and capacity
    variables: [dry_run, enable_termination, max_profiles, max_pool_size, max_active_pools, max_total_ocpus]
  - title: IAM and resource naming
    variables: [create_iam_resources, invoker_group_ocids, name_prefix, dynamic_group_name, ledger_bucket_name]
variables:
  region:
    type: oci:identity:region:name
    required: true
    title: Region
  tenancy_ocid:
    type: string
    required: true
    title: Tenancy OCID
  controller_compartment_ocid:
    type: oci:identity:compartment:id
    required: true
    title: Controller compartment
  pool_compartment_ocid:
    type: oci:identity:compartment:id
    required: true
    title: Existing pool compartment
  network_compartment_ocid:
    type: oci:identity:compartment:id
    required: true
    title: Existing network compartment
  function_vcn_ocid:
    type: oci:core:vcn:id
    required: true
    title: Existing Function VCN
    dependsOn:
      compartmentId: ${network_compartment_ocid}
  registry_compartment_ocid:
    type: oci:identity:compartment:id
    required: true
    title: OCIR repository compartment
    description: A private repository is created here automatically. For an existing image, select its repository compartment.
  subnet_ids:
    type: list
    valueType: subnet_item
    required: true
    title: Existing Function subnets
    description: Select existing Function subnets with OCI-service connectivity.
  subnet_item:
    type: oci:core:subnet:id
    visible: false
    dependsOn:
      compartmentId: ${network_compartment_ocid}
      vcnId: ${function_vcn_ocid}
  build_function_image:
    type: boolean
    default: true
    title: Build and deploy the Function automatically
    description: Creates a private OCIR repository and builds the included source for x86 during Apply. Disable only to supply an existing image.
  ocir_username:
    type: string
    required: true
    visible: ${build_function_image}
    title: OCI registry username
    description: Include the identity domain where applicable (for example Default/user@example.com). Do not include the tenancy namespace; it is added automatically.
  ocir_auth_token:
    type: password
    required: true
    visible: ${build_function_image}
    title: OCI auth token
    description: Auth token for the registry user, not the Console password. Create under your profile's Tokens and keys. Restrict access to stack variables and state.
  function_image:
    type: string
    required: true
    visible:
      not: ["${build_function_image}"]
    title: Existing OCIR image address including tag
  function_image_digest:
    type: string
    required: false
    visible:
      not: ["${build_function_image}"]
    title: Optional image digest pin (sha256)
  function_shape:
    type: enum
    enum: [GENERIC_ARM, GENERIC_X86]
    default: GENERIC_ARM
    visible:
      not: ["${build_function_image}"]
    title: Function architecture (must match image)
  auto_discover_pools:
    type: boolean
    default: true
    title: Discover enrolled pools automatically
    description: Reads existing HarnessId and ScaleTestProfile tags in the pool compartment during Plan. A saved nonempty manual allowlist remains authoritative; disable discovery to view or enter it.
  default_pool_max_size:
    type: number
    default: 3
    visible: ${auto_discover_pools}
    title: Maximum workers per discovered pool
    description: Approved size limit for every discovered pool unless overridden below.
  scope_id:
    type: string
    required: false
    default: ""
    title: Controller group (optional for discovery)
    description: Existing HarnessId tag. Leave blank to infer the only enrolled group; enter a value when multiple groups exist. Required for manual enrollment.
  pools:
    type: map
    valueType: pool_entry
    required: true
    title: Existing pool allowlist (keys match ScaleTestProfile)
    description: Enter the pinned pool OCID, worker type and approved maximum size. A nonempty map takes precedence over automatic discovery; Terraform verifies every pool and its launch configuration at plan time.
  pool_entry:
    type: object
    visible: false
    attributes: [pool_id, worker_type, max_size]
  pool_id:
    type: string
    actualName: pool_id
    visible: false
    required: true
  worker_type:
    type: string
    actualName: worker_type
    visible: false
    required: true
  max_size:
    type: number
    actualName: max_size
    visible: false
    required: true
  pool_overrides:
    type: map
    valueType: pool_override_entry
    required: false
    default: {}
    title: Optional per-profile overrides
    description: Leave empty to use discovery defaults. Add a ScaleTestProfile key only to override its worker type or approved maximum size.
  pool_override_entry:
    type: object
    visible: false
    attributes: [pool_override_worker_type, pool_override_max_size]
  pool_override_worker_type:
    type: string
    actualName: worker_type
    visible: false
    required: false
    title: Optional worker type override
  pool_override_max_size:
    type: number
    actualName: max_size
    visible: false
    required: false
    title: Optional maximum size override
  dry_run:
    type: boolean
    default: true
    title: Dry-run (keep enabled for initial validation)
  enable_termination:
    type: boolean
    default: false
    title: Enable targeted termination (leave disabled initially)
  create_iam_resources:
    type: boolean
    default: false
    title: Create reviewed IAM policies and dynamic group
  invoker_group_ocids:
    type: list
    valueType: invoker_group_item
    title: Existing approved invoking group OCIDs
  invoker_group_item:
    type: string
    visible: false
  max_profiles:
    type: number
    default: 6
    title: Registry profile ceiling
  max_pool_size:
    type: number
    default: 50
    title: Per-profile worker ceiling
  max_active_pools:
    type: number
    default: 1
    title: Simultaneously active pool ceiling
  max_total_ocpus:
    type: number
    default: 16
    title: Aggregate OCPU ceiling
  name_prefix:
    type: string
    default: oci-pool-controller
    title: Resource name prefix
  dynamic_group_name:
    type: string
    title: Optional existing IAM dynamic-group name
  ledger_bucket_name:
    type: string
    title: Optional Object Storage ledger-bucket name
    description: >-
      This stack creates a dedicated private, versioned ledger bucket. Leave
      blank to use the generated name; do not provide an existing shared bucket.
outputs:
  function_image:
    type: string
    title: Deployed Function image
  function_image_digest:
    type: string
    title: Deployed image digest
  function_ocid:
    type: ocid
    title: Controller Function
  invoke_endpoint:
    type: string
    title: Signed Functions invoke endpoint
